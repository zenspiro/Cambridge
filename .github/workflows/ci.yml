# Order (brief 15.5): typecheck, checks, migrations, deploy. A broken change never ships.
# Pull requests and pushes run the checks. Only a push to main migrates and deploys, and only when
# "All checks passed" is green (the check branch protection requires).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual run gets its own group, so several can run on one commit (to find tests that fail by chance).
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast checks: types, unit tests, the inline check and the Worker build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Inline code check
        run: npm run check:inline
      - name: Build Worker
        run: npm run build:worker

  # The browser suite in groups side by side (review, 10 Nov 2026: faster runs instead of skipping them), each
  # on its own fresh local database. Every file also passes on its own (checked when the groups were made).
  e2e:
    name: browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library and agent
            files: smoke admin library folder agent
          - name: subject brain
            files: brain
            poppler: true
          - name: accounts and team
            files: themes accounts profile family team
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Worker
        run: npm run build:worker
      - name: Migrations (local D1)
        run: npm run db:migrate:local
      # Owner, 11 Nov 2026: an outage of Ubuntu's mirrors failed every group before a test ran, 11 minutes each. The
      # browser comes from Playwright's own servers; its system packages are tried for 2 minutes (the runner image
      # already has what headless Chromium needs); Poppler falls back to other mirrors. Fails in minutes, not 11.
      - name: Browser tools
        timeout-minutes: 8
        run: |
          npx playwright install chromium
          # Poppler first: only the brain group needs it, and it must not wait on a cut-short apt-get's lock.
          if ! bash scripts/ci/install-poppler.sh; then
            if [ "${{ matrix.poppler }}" = "true" ]; then exit 1; fi
            echo "::warning::No Poppler; this group does not need it"
          fi
          if ! timeout 120 npx playwright install-deps chromium; then
            sudo pkill -x apt-get || true
            echo "::warning::Browser system packages not installed (Ubuntu's mirrors did not answer); using the runner image's own"
          fi
      - name: Browser tests
        env:
          FILES: ${{ matrix.files }}
        run: |
          set -o pipefail
          cp .dev.vars.example .dev.vars
          npx wrangler dev --local --port 8787 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/health > /dev/null && break; sleep 1; done
          status=0
          for f in $FILES; do
            echo "::group::$f"
            node "tests/e2e/$f.mjs" 2>&1 | tee -a e2e.log || status=1
            echo "::endgroup::"
          done
          exit $status
      # The Worker log first, folded; the failing checks last, so they are what the log ends with.
      - name: What failed
        if: failure()
        run: |
          echo "::group::Worker log (last 400 lines)"
          tail -n 400 wrangler-dev.log || true
          echo "::endgroup::"
          echo "Failing checks:"
          grep -nE "^FAIL|Error|Timeout|exceeded|triggerUncaughtException" e2e.log | tail -n 40 || echo "(none printed: see the test group above)"
          grep -E "^FAIL" e2e.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done || true

  # The one check branch protection requires: green only when every job above is green.
  all:
    name: All checks passed
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "check: $CHECK, browser: $E2E"
          test "$CHECK" = success && test "$E2E" = success

  deploy:
    needs: all
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the D1 database id
        run: node scripts/set-d1-id.ts
      - name: Record the commit and time being deployed
        run: node scripts/set-build-info.ts
      - name: Migrations (production D1)
        run: npm run db:migrate:remote
      - name: Deploy
        run: npm run deploy
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            curl -sf https://cambridge.zenspiroapps.workers.dev/health && exit 0
            sleep 6
          done
          echo "Health check failed after deploy" && exit 1
